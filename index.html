'use strict';const SEED=JSON.parse(document.getElementById('seed').textContent),KEY='chaenggyeo-v1';const PEOPLE=['주영','미연','하민'];const PLACES=['카페','공원','야외 나들이','키즈카페','본가','결혼식장','호텔','펜션','수영장','물놀이','캠핑'];const DUR={short:'2~3시간',half:'반나절',full:'하루 종일',overnight_1:'1박 2일'};const WEATHER={normal:'선택 안 함',rain:'비',cold:'추위',hot:'더위'};const clean= s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!data||!Array.isArray(data.trips))data={schema:1,trips:[],favorites:[],prefs:{}};let page='home',current=null,filter='전체',search='',newPeople=['미연','하민'],newPlaces=['카페'],newDuration='short',newDate=new Date().toLocaleDateString('en-CA'),newDateUnknown=false,newWeather='normal',newTitle='',modal=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('저장 공간이 부족하거나 저장이 차단됐습니다. 설정에서 JSON 백업을 해주세요.')}}function trip(){return data.trips.find(t=>t.id===current)}function isOver(d){return d==='overnight_1'}function initialItems(people,places,dur,weather){let out=[];for(const raw of SEED.items){let placeSpecific=raw.places&&raw.places.length>0;if(placeSpecific&&!raw.places.some(p=>places.includes(p)||places.some(z=>z==='본가'&&p==='숙소')))continue;let qty=Number(raw.quantity?.[dur]??0);if(qty<=0)continue;if(raw.optional&&!placeSpecific)continue;let pp=[];const fp=raw.for_person;if(fp==='공용')pp=['공용'];else if(fp==='각 성인')pp=people.filter(x=>x!=='하민');else if(fp==='각 참가자')pp=[...people];else if(people.includes(fp))pp=[fp];else pp=[];for(const who of pp){out.push({id:id(),seedId:raw.id,name:raw.name,person:who,group:raw.group,unit:raw.unit,qty,done:false,excluded:false,last:!!raw.last_check,order:out.length,optional:!!raw.optional})}}const extras=weather==='rain'?[['우산','공용','개',1],['유모차 레인커버','하민','개',1]]:weather==='cold'?[['겉옷','하민','벌',1]]:weather==='hot'?[['모자','하민','개',1]]:[];for(const [name,person,unit,qty] of extras){if(person==='하민'&&!people.includes('하민'))continue;const matched=out.find(x=>x.name===name&&x.person===person);if(matched)matched.qty=Math.max(matched.qty,qty);else out.push({id:id(),name,person,group:'carry',unit,qty,done:false,excluded:false,last:false,order:out.length})}return out}
function newTrip(from){let t;if(from){t=structuredClone(from);t.id=id();t.title=from.title+' (새 외출)';t.date=newDate;t.finished=false;t.created=Date.now();t.items=t.items.filter(x=>!x.excluded).map(x=>({...x,id:id(),done:false,excluded:false}));t.feedback=[]}else{t={id:id(),title:newTitle.trim()||`${newPlaces.join('·')||'외출'} (${newPeople.join('·')})`,people:[...newPeople],places:[...newPlaces],duration:newDuration,date:newDateUnknown?'':newDate,weather:newWeather,finished:false,created:Date.now(),items:initialItems(newPeople,newPlaces,newDuration,newWeather),feedback:[]}}data.trips.unshift(t);current=t.id;page='trip';save();render()}
function button(label,fn,cl='btn light smallbtn'){return `<button class="${cl}" onclick="${fn}">${label}</button>`}function selectPill(label,selected,handler){return `<button class="pill ${selected?'sel':''}" onclick="${handler}">${clean(label)}</button>`}function nav(){document.getElementById('nav').innerHTML=[['home','⌂ 홈'],['create','＋ 외출'],['history','▤ 기록'],['settings','⚙ 설정']].map(([p,l])=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${l}</button>`).join('')};function go(p){page=p;current=p==='trip'?current:null;filter='전체';search='';render()}function today(){return new Date().toLocaleDateString('en-CA')}
function render(){nav();let e=document.getElementById('app');if(page==='home'){const active=data.trips.filter(t=>!t.finished),fav=data.favorites; e.innerHTML=`<h2>외출 준비</h2>${active.length?active.map(t=>`<div class="card"><div class="line"><b>${clean(t.title)}</b><span class="small">${clean(t.date||'날짜 미정')}</span></div><div class="sub">${clean(t.people.join(' · '))} · ${clean(DUR[t.duration]||t.duration)}</div>${progress(t)}<div style="height:8px"></div>${button('이어서 준비',`openTrip('${t.id}')`,'btn wide')}</div>`).join(''):'<div class="card empty">준비 중인 외출이 없어.<br>아래 버튼으로 첫 외출을 만들어 봐!</div>'}${button('＋ 새 외출 만들기',`go('create')`,'btn wide')}<div class="section"><h2>즐겨찾기</h2>${fav.length?fav.map(f=>`<div class="card line"><div><b>${clean(f.title)}</b><div class="small">${clean(f.people.join('·'))} · ${clean(f.places.join('·'))}</div></div>${button('불러오기',`startFavorite('${f.id}')`)}</div>`).join(''):'<div class="sub">자주 쓰는 외출은 지난 외출 화면에서 즐겨찾기로 저장할 수 있어.</div>'}</div><div class="section"><h2>최근 외출</h2>${data.trips.slice(0,3).map(t=>`<div class="card line"><div><b>${clean(t.title)}</b><div class="small">${t.finished?'완료':'준비 중'} · ${clean(t.date||'미정')}</div></div>${button('보기',`openTrip('${t.id}')`)}</div>`).join('')||'<p class="sub">아직 기록이 없어.</p>'}</div>`}
else if(page==='create'){e.innerHTML=`<h2>새 외출 만들기</h2><div class="card"><label>가는 사람</label><div class="flex">${PEOPLE.map(p=>selectPill(p,newPeople.includes(p),`toggleNew('person','${p}')`)).join('')}</div><label>방문 장소 (여러 개 선택 가능)</label><div class="flex">${PLACES.map(p=>selectPill(p,newPlaces.includes(p),`toggleNew('place','${p}')`)).join('')}</div><label>외출 기간</label><div class="flex">${Object.entries(DUR).map(([k,v])=>selectPill(v,newDuration===k,`newDuration='${k}';render()`)).join('')}</div><label>날씨 (필요할 때만)</label><div class="flex">${Object.entries(WEATHER).map(([k,v])=>selectPill(v,newWeather===k,`newWeather='${k}';render()`)).join('')}</div><label>날짜</label><div class="dateinline"><input type="date" id="tripDate" value="${clean(newDate)}" onchange="newDate=this.value;newDateUnknown=false"><label style="white-space:nowrap;margin:0"><input type="checkbox" ${newDateUnknown?'checked':''} onchange="newDateUnknown=this.checked"> 미정</label></div><label>외출 이름 (선택)</label><input id="tripName" style="width:100%" placeholder="비워두면 자동 생성" value="${clean(newTitle)}" oninput="newTitle=this.value"><p class="sub">준비물과 추천 수량은 자동으로 채워져. 만든 뒤에도 자유롭게 수정할 수 있어.</p><button class="btn wide" ${!newPeople.length||!newPlaces.length?'disabled':''} onclick="newTrip()">준비물 자동 생성</button></div>`}
else if(page==='history'){e.innerHTML=`<h2>외출 기록</h2>${data.trips.map(t=>`<div class="card"><div class="line"><b>${clean(t.title)}</b><span class="small">${t.finished?'완료':'준비 중'}</span></div><div class="small">${clean(t.date||'날짜 미정')} · ${clean(t.people.join('·'))}</div><div class="flex" style="margin-top:12px">${button('목록 보기',`openTrip('${t.id}')`)}${button('이 목록으로 새 외출',`copyTrip('${t.id}')`)}${button('☆ 즐겨찾기',`favorite('${t.id}')`)}</div></div>`).join('')||'<div class="empty">아직 외출 기록이 없어.</div>'}`}
else if(page==='settings'){e.innerHTML=`<h2>설정과 백업</h2><div class="callout">현재 버전은 <b>이 기기에만 저장</b>돼. 주영·미연 휴대폰 자동 동기화는 아직 연결되지 않았어. 브라우저 데이터를 삭제하면 기록이 사라질 수 있으니 JSON 백업을 해줘.</div><div class="card"><h3>기록 내보내기</h3><p class="sub">모든 외출, 체크, 즐겨찾기, 수정 기록을 JSON 파일로 저장해.</p>${button('전체 데이터 백업',`backup()`,'btn wide')}<div class="divider"></div><h3>백업 복원</h3><p class="sub">복원 시 현재 앱 기록을 백업 파일 내용으로 바꿔. 먼저 현재 기록을 백업해 두는 걸 권장해.</p><input type="file" id="importFile" accept=".json,application/json" onchange="importBackup(this.files[0])" style="width:100%"></div><div class="card"><b>초기 제공 준비물</b><p class="sub">${SEED.items.length}개 물품 정보 내장 · 기본 수량은 추천 초안으로, 실제 사용 패턴에 맞게 수정해.</p></div><div class="card"><h3>앞으로 추가할 기능</h3><p class="sub">부부 계정 로그인, Firebase 실시간 공유, 오프라인 충돌 처리, 자동 학습 제안 고도화 등</p></div>`}
else if(page==='trip'){const t=trip();if(!t){go('home');return}const visible=t.items.filter(x=>!x.excluded),done=visible.filter(x=>x.done).length;let fil=visible.filter(x=>(filter==='전체'||x.person===filter)&&x.name.toLowerCase().includes(search.toLowerCase()));let groups=[['wear','직접 착용'],['carry','챙겨가기']];e.innerHTML=`<div class="line"><h2 style="margin:0">${clean(t.title)}</h2>${button('✎ 이름',`editName()`,'btn light smallbtn')}</div><p class="sub">${clean(t.people.join(' · '))} · ${clean(t.places.join(' + '))} · ${clean(DUR[t.duration]||t.duration)} · ${clean(t.date||'날짜 미정')}</p><div class="card"><div class="line"><b>${t.finished?'외출 완료':'준비 중'}</b><b>${done}/${visible.length} · ${visible.length?Math.round(done/visible.length*100):100}%</b></div>${progress(t)}</div><div class="flex"><button class="pill" onclick="lastCheck()">⏰ 출발 전 확인</button><button class="pill" onclick="showExcluded()">제외한 물건 (${t.items.filter(x=>x.excluded).length})</button></div><div class="section"><div class="flex">${['전체',...t.people,'공용'].filter((x,i,a)=>a.indexOf(x)===i).map(p=>selectPill(p,filter===p,`filter='${p}';render()`)).join('')}</div><label>준비물 검색</label><input style="width:100%" placeholder="물건 이름 검색" value="${clean(search)}" oninput="search=this.value;renderKeepFocus()"></div>${groups.map(([g,name])=>{const list=fil.filter(x=>x.group===g).sort((a,b)=>Number(a.done)-Number(b.done)||a.order-b.order);return `<section class="section"><div class="line"><h3>${name}</h3><span class="small">${list.filter(x=>x.done).length}/${list.length}</span></div><div class="card">${list.length?list.map(x=>itemRow(t,x)).join(''):'<div class="sub">해당 물품 없음</div>'}</div></section>`}).join('')}<div class="card"><h3>준비물 추가</h3><div class="line"><input style="flex:1;min-width:0" placeholder="예: 장난감" id="addName"><button class="btn" onclick="addItem()">+ 추가</button></div><p class="small">추가한 물건은 기본적으로 공용·챙겨가기로 표시돼. 물건을 눌러 변경할 수 있어.</p></div><div class="section">${t.finished?button('외출 다시 열기',`reopen()`,'btn wide light'):button('외출 완료 · 피드백',`finish()`,'btn wide')}${button('이 목록으로 새 외출',`copyTrip('${t.id}')`,'btn wide light')}${button('☆ 즐겨찾기 등록',`favorite('${t.id}')`,'btn wide ghost')}</div>`}document.getElementById('modal').innerHTML=modal||''}
function progress(t){let v=t.items.filter(x=>!x.excluded);return `<div class="progress" style="margin-top:9px"><div style="width:${v.length?100*v.filter(x=>x.done).length/v.length:100}%"></div></div>`}
function renderKeepFocus(){let p=document.activeElement?.selectionStart;render();let el=document.querySelector('input[placeholder="물건 이름 검색"]');if(el){el.focus();el.setSelectionRange(p,p)}}function itemRow(t,x){return `<div class="item ${x.done?'done':''}"><input type="checkbox" ${x.done?'checked':''} onchange="checkItem('${x.id}',this.checked)"><div class="itemmain" onclick="editItem('${x.id}')"><div class="itemname">${clean(x.name)}</div><span class="tag">${clean(x.person)}</span>${x.last?'<span class="tag">출발 직전 확인</span>':''}</div><div class="counts"><button onclick="qty('${x.id}',-1)">−</button><input aria-label="${clean(x.name)} 수량" type="number" min="0" value="${x.qty}" onchange="setQty('${x.id}',this.value)"><button onclick="qty('${x.id}',1)">+</button></div><span class="small">${clean(x.unit)}</span><button class="tinybtn" onclick="excludeItem('${x.id}')">제외</button></div>`}
function openTrip(i){current=i;page='trip';filter='전체';search='';render()}function toggleNew(type,v){let ar=type==='person'?newPeople:newPlaces;if(ar.includes(v))ar.splice(ar.indexOf(v),1);else ar.push(v);render()}function mutateItem(i,fn){let x=trip()?.items.find(y=>y.id===i);if(x){fn(x);save();render()}}function checkItem(i,v){mutateItem(i,x=>x.done=v)}function setQty(i,v){let n=Math.max(0,Number(v)||0);mutateItem(i,x=>{x.qty=n;x.excluded=n===0;x.done=false})}function qty(i,delta){let x=trip().items.find(y=>y.id===i);setQty(i,Number(x.qty)+delta)}function excludeItem(i){mutateItem(i,x=>{x.excluded=true;x.done=false})}function showExcluded(){let t=trip();showModal(`<h2>제외한 물건</h2>${t.items.filter(x=>x.excluded).map(x=>`<div class="item"><div class="itemmain">${clean(x.name)} <span class="small">${clean(x.person)}</span></div>${button('복원',`restoreItem('${x.id}')`)}</div>`).join('')||'<p class="sub">제외한 물건이 없어.</p>'}`)}function restoreItem(i){let x=trip().items.find(x=>x.id===i);if(x){x.excluded=false;x.qty=Math.max(1,x.qty);x.done=false;save();closeModal();render()}}
function showModal(inner){modal=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal">${inner}<div style="margin-top:18px">${button('닫기','closeModal()','btn wide light')}</div></div></div>`;document.getElementById('modal').innerHTML=modal}function closeModal(){modal=null;document.getElementById('modal').innerHTML=''}
function editItem(i){let x=trip().items.find(x=>x.id===i);showModal(`<h2>준비물 수정</h2><label>물건 이름</label><input id="editItemName" value="${clean(x.name)}" style="width:100%"><label>사용하는 사람</label><select id="editPerson" style="width:100%">${['공용',...PEOPLE].map(p=>`<option value="${p}" ${p===x.person?'selected':''}>${p}</option>`).join('')}</select><label>준비 방식</label><select id="editGroup" style="width:100%"><option value="wear" ${x.group==='wear'?'selected':''}>직접 착용</option><option value="carry" ${x.group==='carry'?'selected':''}>챙겨가기</option></select><label><input type="checkbox" id="editLast" ${x.last?'checked':''}> 출발 직전 확인</label><div style="height:12px"></div>${button('변경 저장',`commitEdit('${i}')`,'btn wide')}`)}function commitEdit(i){let x=trip().items.find(x=>x.id===i),n=document.getElementById('editItemName').value.trim();if(!n)return alert('이름을 입력해줘');x.name=n;x.person=document.getElementById('editPerson').value;x.group=document.getElementById('editGroup').value;x.last=document.getElementById('editLast').checked;save();closeModal();render()}function addItem(){let n=document.getElementById('addName')?.value.trim();if(!n)return;trip().items.push({id:id(),name:n,person:'공용',group:'carry',unit:'개',qty:1,done:false,excluded:false,last:false,order:trip().items.length,manual:true});save();render()}function lastCheck(){const t=trip(),items=t.items.filter(x=>x.last&&!x.excluded);showModal(`<h2>출발 전 확인</h2><p class="sub">원래 체크리스트와 동일한 체크 상태야.</p>${items.map(x=>`<div class="item"><input type="checkbox" ${x.done?'checked':''} onchange="checkLast('${x.id}',this.checked)"><div class="itemmain">${clean(x.name)} <span class="small">${clean(x.person)}</span></div></div>`).join('')||'<p>출발 직전 확인할 물건이 없어.</p>'}`)}function checkLast(i,v){let x=trip().items.find(x=>x.id===i);x.done=v;save();lastCheck();render()}
function editName(){showModal(`<h2>외출 이름 바꾸기</h2><input id="rename" style="width:100%" value="${clean(trip().title)}"><div style="height:12px"></div>${button('저장',`renameTrip()`,'btn wide')}`)}function renameTrip(){trip().title=document.getElementById('rename').value.trim()||trip().title;save();closeModal();render()}function finish(){showModal(`<h2>외출 마무리</h2><p>외출을 완료하고 이번 준비물에 대한 간단 피드백을 남길 수 있어.</p>${button('문제없었어요',`finishWith('ok')`,'btn wide')}<div style="height:8px"></div>${button('개선할 게 있어요',`feedbackForm()`,'btn wide light')}<div style="height:8px"></div>${button('피드백 없이 완료',`finishWith('skip')`,'btn wide ghost')}`)}function feedbackForm(){showModal(`<h2>이번 외출 피드백</h2><p class="sub">한 줄만 적어도 돼. 자동 AI 분석은 아직 없고, 기록에 저장해 다음번에 확인할 수 있어.</p><textarea id="feedbackText" style="width:100%;min-height:130px;border:1px solid #cbd8ce;border-radius:12px;padding:12px" placeholder="예: 기저귀가 2개 남았어. 다음에는 조금 줄여도 될 듯"></textarea><div style="height:10px"></div>${button('저장하고 외출 완료',`finishWith('note')`,'btn wide')}`)}function finishWith(type){let t=trip();t.finished=true;t.finishedAt=Date.now();if(type==='note'){t.feedback.push({at:Date.now(),text:document.getElementById('feedbackText').value})}save();closeModal();render()}function reopen(){trip().finished=false;save();render()}function copyTrip(i){let t=data.trips.find(t=>t.id===i);newTrip(t)}function favorite(i){let t=data.trips.find(t=>t.id===i);let existing=data.favorites.find(f=>f.source===i);if(existing){alert('이미 즐겨찾기로 저장되어 있어.');return}data.favorites.push({...structuredClone(t),id:id(),source:i});save();alert('즐겨찾기에 추가했어.');render()}function startFavorite(i){let f=data.favorites.find(x=>x.id===i);newTrip(f)}function backup(){const blob=new Blob([JSON.stringify({format:'chaenggyeo-backup',exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='chaenggyeo_backup_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importBackup(file){if(!file)return;try{let obj=JSON.parse(await file.text());if(obj.format!=='chaenggyeo-backup'||!Array.isArray(obj.data?.trips))throw Error('형식이 맞지 않아');if(!confirm('현재 기록을 모두 덮어쓸까? 먼저 백업했는지 확인해줘.'))return;data=obj.data;save();go('home');alert('복원 완료!')}catch(e){alert('복원 실패: '+e.message)}}
render();</script></body></html>
